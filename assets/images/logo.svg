<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- WebRTC Cyber Cyan Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Node Gradient (Left: Browser / Cyan) -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Node Gradient (Right: NAS Server / Purple) -->
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Central Gateway Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Hexagonal Shield Container -->
  <path d="M 256,24 
           L 448,104 
           L 448,328 
           C 448,408 360,464 256,492 
           C 152,464 64,408 64,328 
           L 64,104 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Subtle Geometric Grid / Circuit Lines in Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="190" stroke-dasharray="4 8" />
    <circle cx="256" cy="256" r="140" />
    <line x1="64" y1="256" x2="448" y2="256" stroke-dasharray="6 6" />
    <line x1="256" y1="50" x2="256" y2="460" stroke-dasharray="6 6" />
  </g>

  <!-- WebRTC Radio/Signal Propagation Waves (P2P Discovery) -->
  <g opacity="0.35" stroke="url(#beamGrad)" stroke-width="3.5" fill="none" stroke-linecap="round">
    <!-- Left Waves (Client side) -->
    <path d="M 176,196 A 85 85 0 0 0 176,316" />
    <path d="M 152,176 A 115 115 0 0 0 152,336" opacity="0.6" />
    <!-- Right Waves (Server side) -->
    <path d="M 336,196 A 85 85 0 0 1 336,316" stroke="url(#borderGrad)" />
    <path d="M 360,176 A 115 115 0 0 1 360,336" stroke="url(#borderGrad)" opacity="0.6" />
  </g>

  <!-- Gateway Portal Arch & Infinity WebRTC Tunnel -->
  <g filter="url(#glow)">
    <!-- Central Hexagonal Portal Vault -->
    <polygon points="256,160 330,202 330,310 256,352 182,310 182,202"
             fill="#030712"
             fill-opacity="0.85"
             stroke="url(#coreGrad)"
             stroke-width="5"
             stroke-linejoin="round" />

    <!-- Inner Gateway Energy Ring -->
    <circle cx="256" cy="256" r="48"
            fill="none"
            stroke="url(#beamGrad)"
            stroke-width="4"
            stroke-dasharray="12 6" />
  </g>

  <!-- High-Speed P2P Direct Penetration Lightning Beam -->
  <path d="M 120,256 L 220,256 L 244,228 L 268,284 L 292,256 L 392,256" 
        fill="none" 
        stroke="url(#beamGrad)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#intenseGlow)" />

  <!-- Core Penetration Energy Lightning (Foreground White Accent) -->
  <path d="M 140,256 L 220,256 L 244,232 L 268,280 L 292,256 L 372,256" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Left Node: Client / Modern Browser Endpoint -->
  <g transform="translate(120, 256)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <circle cx="0" cy="0" r="16" fill="url(#clientGrad)" />
    <!-- Browser window minimal glyph inside node -->
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Right Node: Private Intranet / NAS Server Endpoint -->
  <g transform="translate(392, 256)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#c084fc" stroke-width="4" />
    <circle cx="0" cy="0" r="16" fill="url(#serverGrad)" />
    <!-- Server pulse dot -->
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Dynamic Security Lock / Zero-Client Emblem in Portal Center -->
  <g transform="translate(256, 256)" filter="url(#intenseGlow)">
    <!-- Central P2P Core Spark -->
    <polygon points="256,242 266,256 256,270 246,256"
             fill="#ffffff"
             transform="translate(-256, -256)" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
  </g>

  <!-- Top Gateway Crown Star (Direct Connection Spark) -->
  <polygon points="256,76 262,94 280,100 262,106 256,124 250,106 232,100 250,94"
           fill="#38bdf8"
           opacity="0.9"
           filter="url(#glow)" />
</svg>
