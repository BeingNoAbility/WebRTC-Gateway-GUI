<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Text Glow Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="90%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Outer Card -->
  <rect x="2" y="2" width="876" height="216" rx="20" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Left: Embedded Brand Logo Emblem (Scaled to 170x170 at x=30, y=25) -->
  <g transform="translate(35, 20) scale(0.35)">
    <!-- Base Hexagonal Shield Container -->
    <path d="M 256,24 L 448,104 L 448,328 C 448,408 360,464 256,492 C 152,464 64,408 64,328 L 64,104 Z" 
          fill="#090d16" 
          stroke="url(#borderGrad)" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Radio Waves -->
    <g opacity="0.4" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M 176,196 A 85 85 0 0 0 176,316" />
      <path d="M 336,196 A 85 85 0 0 1 336,316" stroke="#c084fc" />
    </g>

    <!-- Central Hexagonal Vault -->
    <polygon points="256,160 330,202 330,310 256,352 182,310 182,202"
             fill="#020617" stroke="url(#borderGrad)" stroke-width="8" stroke-linejoin="round" />
    <circle cx="256" cy="256" r="48" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="14 8" />

    <!-- Lightning Beam -->
    <path d="M 120,256 L 220,256 L 244,228 L 268,284 L 292,256 L 392,256" 
          fill="none" stroke="#00f2fe" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 140,256 L 220,256 L 244,232 L 268,280 L 292,256 L 372,256" 
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Nodes -->
    <circle cx="120" cy="256" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
    <circle cx="120" cy="256" r="14" fill="#38bdf8" />
    <circle cx="392" cy="256" r="30" fill="#0f172a" stroke="#c084fc" stroke-width="6" />
    <circle cx="392" cy="256" r="14" fill="#c084fc" />
  </g>

  <!-- Right: Modern Brand Typography -->
  <g transform="translate(240, 0)">
    <!-- Badges Row -->
    <g transform="translate(0, 42)">
      <!-- Badge 1: Zero-Client -->
      <rect x="0" y="0" width="108" height="26" rx="13" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="54" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ZERO-CLIENT</text>

      <!-- Badge 2: P2P Direct -->
      <rect x="118" y="0" width="94" height="26" rx="13" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1.2" />
      <text x="165" y="17" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">P2P DIRECT</text>

      <!-- Badge 3: DTLS Encrypted -->
      <rect x="222" y="0" width="132" height="26" rx="13" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1.2" />
      <text x="288" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">DTLS ENCRYPTED</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="118" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      WebRTC Gateway
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.2">
      Zero-Client Browser-to-Intranet End-to-End Penetration
    </text>

    <!-- Chinese Subtitle -->
    <text x="0" y="178" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400">
      浏览器零客户端依赖 · P2P 点对点极速直连 · 端到端强加密内网穿透
    </text>
  </g>
</svg>
